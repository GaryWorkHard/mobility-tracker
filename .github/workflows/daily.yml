name: Daily mobility price check

on:
  schedule:
    - cron: "17 11 * * *"      # every day at 11:17 UTC (about 3-4 am Pacific, 6-7 am Eastern)
  workflow_dispatch: {}         # lets you start it by hand from the Actions tab

permissions:
  contents: write               # needed to save the results back into the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install packages and headless browser
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run the tracker
        run: python run.py
        continue-on-error: true   # still save whatever succeeded; failures are listed in data/run_log.csv
      - name: Save results
        run: |
          git config user.name "price-tracker"
          git config user.email "price-tracker@users.noreply.github.com"
          git add data/current.csv data/history.csv data/run_log.csv
          git commit -m "Prices for $(date -u +%F)" || echo "nothing to commit"
          git push
